[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "backfill-pipeline"
version = "0.1.0"
description = "Idempotent backfill runner for partitioned warehouse tables"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Aylin Demir" }]
dependencies = ["psycopg[binary]>=3.1"]

[project.scripts]
backfill = "backfill.cli:main"

[tool.setuptools]
packages = ["backfill"]
